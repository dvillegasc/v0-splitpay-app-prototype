name: Agente Autónomo SplitPay (Frontend)

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitpay-frontend-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Dependencias del proyecto
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cliente de Gemini
        run: pip install google-genai

      - name: Identidad de Git
        run: |
          git config user.name 'splitpay-agent[bot]'
          git config user.email 'splitpay-agent-bot@users.noreply.github.com'

      - name: Ejecutar el agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.REVIEWER_API_KEY }}
        run: python agent.py
